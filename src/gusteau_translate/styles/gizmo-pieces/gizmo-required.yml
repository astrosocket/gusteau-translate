Units:
  Unit_current_CGS:
    constant: 1
    type: ConstantAttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_I}
  Unit_length_CGS:
    input_path: "/Header.UnitLength_In_CGS"
    type: AttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_L}
  Unit_mass_CGS:
    input_path: "/Header.UnitMass_In_CGS"
    type: AttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_M}
  Unit_temperature_CGS:
    constant: 1
    type: ConstantAttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_T}
  Unit_time_CGS:
    input_path: "/Header.UnitVelocity_In_CGS"
    type: AttributeTranslation
    pipeline:
      Math2Step: {equation: "y/x", external: "/Header.UnitLength_In_CGS"}
      SaveQuantityStep: {name: U_t}
  Gravitational_constant:
    # Note the typo:
    input_path: "/Header.Gravitational_Constant_In_Code_Inits"
    type: AttributeTranslation
  Unit_current_PhysCGS:
    constant: 1
    type: ConstantAttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_pI}
  Unit_length_PhysCGS:
    input_path: "/Header.UnitLength_In_CGS"
    type: AttributeTranslation
    pipeline:
      Math2Step:
        equation: "x/y * (y1 * y2 + (1 - y2) )"
        external:
          - "/Header.HubbleParam"
          - "/Header.Time" # Scale-factor in comoving runs
          - "/Header.ComovingIntegrationOn"
      SaveQuantityStep: {name: U_pL}
  Unit_mass_PhysCGS:
    input_path: "/Header.UnitMass_In_CGS"
    type: AttributeTranslation
    pipeline:
      Math2Step:
        equation: "x / y"
        external:
          - "/Header.HubbleParam"
      SaveQuantityStep: {name: U_pM}
  Unit_temperature_PhysCGS:
    constant: 1
    type: ConstantAttributeTranslation
    pipeline:
      SaveQuantityStep: {name: U_pT}
  Unit_time_PhysCGS:
    input_path: "/Header.UnitVelocity_In_CGS"
    type: AttributeTranslation
    pipeline:
      Math2Step:
        # (U_L / h * (a*C + (1-C))) / (U_V * (sqrt(a) * C + (1-C)))
        equation: >
          "(y / y2 * (y1 * y3 + (1 - y3)))/(x * (np.sqrt(y1) * y3 + (1 - y3)))"
        external:
          - "/Header.UnitLength_In_CGS" # y
          - "/Header.Time" # y1 (scale_factor if ComovingIntegrationOn)
          - "/Header.HubbleParam" # y2
          - "/Header.ComovingIntegrationOn" # y3
      SaveQuantityStep: {name: U_pt}
