# Translation style piece for most required fields from GIZMO snapshots
# This will be based on the public version of gizmo and the gizmo documentation.
# Important: this is designed assuming a gizmo version > 2021! (Basically, we
# assume the GIZMO_version header field is present)
# For older versions, try gizmo-required_old.yml or gadget_old.yml
# Version: v0.1.0

# Options are specified in the GUSTEAU group
# This section should **not** be read as part of the specification
GUSTEAU:
  pipeline_class_additions:
    # Steps to add to every translation that has the listed (super)class
    # Note that we do not add the ParseUnitsStep here because we don't know if
    # there are even any particle groups!

  pipeline_path_additions:
    # Steps to add to every translation whose **output** path matches
    # Patterns are matched a la pathlib's
    # [full_match](https://docs.python.org/3/library/pathlib.html#pathlib.PurePath.full_match)
    # with case-sensitive set to True


# The following fields are in GUSTEAU Spec order (header first, then other
# required groups)

# Required groups
Header:
  # Note that a number of these fields are single element arrays instead of
  # scalars
  Code: {constant: GIZMO, type: ConstantAttributeTranslation}
  Source: {constant: gizmo, type: ConstantAttributeTranslation}
  Source_file: {file_path: gizmo, type: FileContentsTranslation}
  Bounding_box:
    input_path: /Header.BoxSize
    type: AttributeTranslation
    pipeline:
      ReorderColumnStep:
        new_width: 6
        col_indices: [-1, -1, -1, 0, 0, 0]
  Time:
    type: AttributeTranslation
    pipeline:
      Math2Step:
        external: /Header.ComovingIntegrationOn
        equation: "(-1**(y)) * x"
  Run_name:
    constant: ""  # Base gizmo doesn't store the run name anywhere
    type: ConstantAttributeTranslation
  Num_files_per_snapshot:
    input_path: /Header.NumFilesPerSnapshot
    type: AttributeTranslation
  Dimension: {constant: 3, type: ConstantAttributeTranslation}
  Snapshot_date:
    attribute: timestamp
    type: SnapshotAttributeTranslation
  Redshift:
    type: AttributeTranslation
    pipeline:
      SaveQuantityStep: {name: z}
  File_index:
    output_path: /Header.File_index
    # Generated during translation
    type: SkipTranslation
  # Gadget-2 header fields
  NumPart_ThisFile:
    type: AttributeTranslation
    dtype: uint32
  MassTable:
    type: AttributeTranslation
  Flag_Sfr: {dtype: int32, type: AttributeTranslation}
  Flag_Feedback: {dtype: int32, type: AttributeTranslation}
  NumPart_Total:
    type: AttributeTranslation
    dtype: int32 # match Gadget-2
  Flag_Cooling: {dtype: int32, type: AttributeTranslation}
  BoxSize:
    type: AttributeTranslation
  Omega0:
    input_path: /Header.Omega_Matter
    depends_on: /Header.ComovingIntegrationOn
    constant: -1
    type: ConditionalRequiredAttributeTranslation
  OmegaLambda:
    input_path: /Header.Omega_Lambda
    depends_on: /Header.ComovingIntegrationOn
    constant: -1
    type: ConditionalRequiredAttributeTranslation
  HubbleParam:
    type: AttributeTranslation
  Flag_StellarAge:
    dtype: int32
    type: AttributeTranslation
  Flag_Metals: {dtype: int32, type: AttributeTranslation}
  NumPart_Total_HW:
    constant: [0, 0, 0, 0, 0, 0]
    type: ConstantAttributeTranslation
    dtype: int32
  Flag_Entropy_ICs:
    # This flag does not appear to be present in the snapshots.
    dtype: int32
    constant: 0
    type: ConstantAttributeTranslation

# All other header fields likely belong in Code or RunInfo

Code:
  Code: {constant: GIZMO, type: ConstantAttributeTranslation}
  Code_version:
    input_path: /Header.GIZMO_version
    dtype: str
    type: AttributeTranslation
  VCS: {constant: git, type: ConstantAttributeTranslation}
  VCS_repository:
    constant: https://github.com/pfhopkins/gizmo-public
    type: ConstantAttributeTranslation
  # Populate on a sim-by-sim basis
  Code_hash: {constant: "", type: ConstantAttributeTranslation}
  HDF5_version:
    constant: ""
    type: ConstantAttributeTranslation
  VCS_id: {constant: "", type: ConstantAttributeTranslation}
  Git_date: {constant: "", type: ConstantAttributeTranslation}
  Library_versions:
    constant: [""]
    type: ConstantAttributeTranslation
  Configuration_options:
    constant: ""
    type: ConstantAttributeTranslation

Cosmology:
  Is_cosmological:
    input_path: /Header.ComovingIntegrationOn
    type: AttributeTranslation
  # Since Omega_matter, ... are only required if Is_cosmological, and will be
  # output, if that's true, we don't need to make them conditional
  Omega_matter:
    input_path: /Header.Omega_Matter
    type: AttributeTranslation
  Omega_lambda:
    input_path: /Header.Omega_Lambda
    type: AttributeTranslation
  h:
    input_path: /Header.HubbleParam
    type: AttributeTranslation
    pipeline:
      SaveQuantityStep: {name: h}
  Redshift:
    input_path: /Header.Redshift
    type: AttributeTranslation
  Scale_factor:
    input_path: /Header.Redshift
    type: AttributeTranslation
    pipeline:
      MathStep: {equation: "1/(1+x)"}
      SaveQuantityStep: {name: a}

  Omega_baryon:
    input_path: /Header.Omega_Baryon
    type: AttributeTranslation

  Omega_radiation:
    input_path: /Header.Omega_Radiation
    type: AttributeTranslation

  # The following are not present in the snapshot
  # Critical_density:
  # Critical_density_at_z0:
  # H:
  # H0:
  # Hubble_time:
  # Lookback_time:
  # Mean_baryon_density:
  # Mean_matter_density:
  # N_eff:
  # Omega_curvature:
  # Omega_darkmatter:
  # Omega_radiation:
  # T_CMB_0:
  # T_CMB_0_SI:
  # Universe_age:
  # a_begin:
  # a_end:
  # Time_begin:
  # Time_end:
  # w:
  # w_0:
  # w_a:

