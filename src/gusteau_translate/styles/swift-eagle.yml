# For the following, arranging by output field is more convenient
# Note that we already created the groups above, otherwise we'd need to create
# them here
Stars:
  FromParent:
    Gas:
      Smoothed:
        MassFractions:
          Hydrogen:
            H:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 0 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Hydrogen/Hydrogen
          Helium:
            He:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 1 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Helium/Helium
          Metals:
            C:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 2 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Carbon
            N:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 3 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Nitrogen
            O:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 4 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Oxygen
            Ne:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 5 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Neon
            Mg:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 6 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Magnesium
            Si:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 7 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Silicon
            Fe:
              input_path: /PartType4/SmoothedElementMassFractions
              columns: 8 # 0-based indexing
              type: ParticleDatasetTranslation
              pipeline:
                LinkStep:
                  path: /Stars/FromParent/Gas/Smoothed/MassFractions/Metals/Iron
            TotalMasses:
              input_path: /PartType4/SmoothedMetalMassFractions
              type: ParticleDatasetTranslation
  Subgrid:
    Luminosities:
      u_band:
        input_path: /PartType4/Luminosities
        columns: 0 # 0-based indexing
        type: ParticleDatasetTranslation
      g_band:
        input_path: /PartType4/Luminosities
        columns: 1 # 0-based indexing
        type: ParticleDatasetTranslation
      r_band:
        input_path: /PartType4/Luminosities
        columns: 2 # 0-based indexing
        type: ParticleDatasetTranslation
      i_band:
        input_path: /PartType4/Luminosities
        columns: 3 # 0-based indexing
        type: ParticleDatasetTranslation
      z_band:
        input_path: /PartType4/Luminosities
        columns: 4 # 0-based indexing
        type: ParticleDatasetTranslation
      Y_band:
        input_path: /PartType4/Luminosities
        columns: 5 # 0-based indexing
        type: ParticleDatasetTranslation
      J_band:
        input_path: /PartType4/Luminosities
        columns: 6 # 0-based indexing
        type: ParticleDatasetTranslation
      H_band:
        input_path: /PartType4/Luminosities
        columns: 7 # 0-based indexing
        type: ParticleDatasetTranslation
      K_band:
        input_path: /PartType4/Luminosities
        columns: 8 # 0-based indexing
        type: ParticleDatasetTranslation
  PreviousParticleTypes:
    type: ConstantParticleDatasetTranslation
    description: "Particle name index of previous particle type"
    constant: 0
    like_dataset: /PartType4/SplitCounts

PartType5:
  output_path: /BlackHoles
  type: GroupTranslation
  has_particles: true
  description: "Black hole particles"
  tags:
    - Feedback
    - Black-hole
    - Particles
    - Group
    - Massive
    - Potential
    - Transform
  pipeline:
    LinkStep:
      path: /PartType5
  children:
    # Attributes
    # NumberOfFields and NumberOfParticles will be included via auto-discovery
    Aliases:
      constant: ["PartType5"]
      type: ConstantAttributeTranslation

    # Groups
    BH:
      description: >
        This subgroup is the primary location to store black hole-related
        subgrid quantities
      tags: []
      type: CreateGroupTranslation
    Feedback:
      description: >
        This subgroup is the primary location to store feedback-related
        subgrid quantities
      tags: ["AGN"]
      type: CreateGroupTranslation
      children:
        AGN:
          description: >
            Active Galactic Nuclei-related feedback quantities
          tags: []
          type: CreateGroupTranslation
    FromParent:
      type: CreateGroupTranslation
      description: >
        Fields retained from the parent particle that are no longer updated
      tags: []
      children:
        Gas:
          type: CreateGroupTranslation
          description: >
            Fields from the parent gas particle
          tags: ["StellarWind"]
          children:
            StellarWind:
              description: >
                This subgroup is the primary location to store stellar
                wind-related subgrid quantities
              tags: ["AGB", "SNII", "SNIa"]
              type: CreateGroupTranslation
              children:
                AGB:
                  description: >
                    Asymptotic Giant Branch-related stellar wind quantities
                  tags: []
                  type: CreateGroupTranslation
                SNIa:
                  description: >
                    Supernovae Type Ia-related stellar wind quantities
                  tags: []
                  type: CreateGroupTranslation
                SNII:
                  description: >
                    Supernovae Type II-related stellar wind quantities
                  tags: []
                  type: CreateGroupTranslation


    # Datasets
    # Note: ParticleIDs, Coordinates, Velocities, Masses, Potentials,
    # can be processed via the auto-discovery
    AGNTotalInjectedEnergies:
      output_path: Feedback/AGN/Total_injected_energies
      type: ParticleDatasetTranslation
    AccretionRates:
      output_path: BH/Total_accretion_rates
      type: ParticleDatasetTranslation
    DynamicalMasses:
      output_path: Masses
      type: ParticleDatasetTranslation
    FOFGroupIDs:
      type: ParticleDatasetTranslation
      pipeline:
        LinkStep: {path: /BlackHoles/GroupIDs}
    FormationScaleFactors:
      output_path: TransformScaleFactors
      type: ParticleDatasetTranslation
    IronMassesFromSNIa:
      output_path: FromParent/Gas/StellarWind/SNIa/Iron_mass_fractions
      type: ParticleDatasetTranslation
    LastAGNFeedbackScaleFactors:
      output_path: Feedback/AGN/Last_event_scale_factors
      type: ParticleDatasetTranslation
    LastHighEddingtonFractionScaleFactors:
      output_path: BH/LastHighEddingtonFractionScaleFactors
      type: ParticleDatasetTranslation
    LastMajorMergerScaleFactors:
      output_path: BH/LastMajorMergerScaleFactors
      type: ParticleDatasetTranslation
    LastMinorMergerScaleFactors:
      output_path: BH/LastMinorMergerScaleFactors
      type: ParticleDatasetTranslation
    MassesFromAGB:
      output_path: FromParent/Gas/StellarWind/AGB/Masses
      type: ParticleDatasetTranslation
    MassesFromSNII:
      output_path: FromParent/Gas/StellarWind/SNII/Masses
      type: ParticleDatasetTranslation
    MassesFromSNIa:
      output_path: FromParent/Gas/StellarWind/SNIa/Masses
      type: ParticleDatasetTranslation
    MetalMassesFromAGB:
      output_path: FromParent/Gas/StellarWind/AGB/MetalMasses
      type: ParticleDatasetTranslation
    MetalMassesFromSNII:
      output_path: FromParent/Gas/StellarWind/SNII/MetalMasses
      type: ParticleDatasetTranslation
    MetalMassesFromSNIa:
      output_path: FromParent/Gas/StellarWind/SNIa/MetalMasses
      type: ParticleDatasetTranslation
    NumberOfAGNEvents:
      output_path: Feedback/AGN/Number_of_events
      type: ParticleDatasetTranslation
    NumberOfHeatingEvents:
      output_path: BH/Number_of_heating_events
      type: ParticleDatasetTranslation
    NumberOfMergers:
      output_path: BH/NumberOfMergers
      type: ParticleDatasetTranslation
    ProgenitorParticleIDs:
      output_path: FromParent/Gas/ProgenitorParticleIDs
      type: ParticleDatasetTranslation
    SmoothingLengths:
      output_path: KernelLengths
      type: ParticleDatasetTranslation
    SplitCounts:
      output_path: FromParent/Gas/SplitCounts
      type: ParticleDatasetTranslation
    SplitTrees:
      output_path: FromParent/Gas/SplitTrees
      type: ParticleDatasetTranslation
    SubgridMasses:
      output_path: BH/Masses
      type: ParticleDatasetTranslation
    TotalAccretedMasses:
      output_path: BH/Total_accreted_masses
      type: ParticleDatasetTranslation

