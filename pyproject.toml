[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [
    {name = "Michael Ryan", email = "mryan1@sas.upenn.edu"},
    {name = "Josh Borrow", email = "josh@joshborrow.com"},
]
description="Tool for translating common astrophysical particle snapshots to the  GUSTEAU specification"
dependencies = [
    "swiftsimio",
    "numpy>=2.4, <2.5",
    "h5py", 
    "tomlkit>=0.15.0,<0.16", 
    "ruamel-yaml>=0.19.1,<0.20",
    "sympy>=1.14.0,<2",
    "packingcubes>=0.6.5,<0.7",
    "pydantic>=2.13.4,<3",
]
name = "gusteau-translate"
requires-python = ">= 3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["astronomy", "astrophysics"]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version","readme"]

[project.urls]
home = "https://github.com/astrosocket/gusteau_translate"
source = "https://github.com/astrosocket/gusteau_translate"
issues = "https://github.com/astrosocket/gusteau_translate/issues/new"

[project.scripts]
alchemize = "gusteau_translate.main:cli"
gusteau-alchemize = "gusteau_translate.main:cli"
gusteau-translate = "gusteau_translate.main:cli"

[tool.hatch.version]
source = "vcs"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # additional flake8
    "FBT","C","A","FA","ICN","LOG","T","PT","Q","RET", "YTT", "S102", "S110", "S112",
    "ASYNC", "DTZ", "T10", "ISC004", "LOG", "PIE", "FLY002", "PERF",
    # Ruff only
    "RUF",
    # isort
    "I",
    # McCabe Complexity
    "C90",
    # numpy
    "NPY",
    # Docstrings
    # "D",
    # "DOC", # only available in ruff preview for now
]
ignore = ["F841", "SIM300", "D400","PIE790"]
unfixable = ["B"]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]
[tool.tombi]
toml-version = "v1.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.tasks]


[tool.pixi.dependencies]
ipykernel = ">=7.3.0,<8"
pip = ">=26.1.2,<27"
yamllint = ">=1.38.0,<2"

[tool.pixi.pypi-dependencies]
gusteau-translate = {path=".", editable=true}
swiftsimio = ">=12.1.4"
numpy = ">=2.4.6, <3"
h5py = ">=3.16.0, <4"

[tool.pixi.feature.style.dependencies]
ruff = ">=0.16.2,<0.17"
ty = ">=0.0.70,<0.0.71"

[tool.pixi.feature.style.tasks]
format = "ruff format"
check = "ruff check --fix"
pylint = "ty check"
ymllint = "yamllint src"
style = [{task="format"}, {task="check"}, {task="pylint"}, {task="ymllint"}]

[tool.pixi.feature.git.dependencies]
pre-commit = "*"


[tool.pixi.feature.ci.dependencies]
pytest = "*"
coverage = "*"
pytest-cov = "*"

[tool.pixi.feature.ci.tasks]
test = "pytest"
swift-eagle = "python tests/run_swift-eagle.py"
compare-swift-eagle = "python tests/test_swift-eagle.py"
test-swift-eagle = [{task="swift-eagle"}, {task="compare-swift-eagle"}]

[tool.pixi.feature.docs.dependencies]
griffe-pydantic = "*"
zensical = ">=0.0.53,<0.0.54"
mkdocstrings-python = "*"
mkdocstrings = "*"

[tool.pixi.feature.docs.tasks]
zserve = "zensical serve"
zbuild = "zensical build"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { features = ["style", "git", "ci"], solve-group = "prod" }
test-py313 = { features = ["ci"], solve-group = "prod-py313" }
test = { features = ["ci"], solve-group = "prod" }
prod-py313 = { features = ["py313"], solve-group = "prod-py13" }
prod = { features = ["py314"], solve-group = "prod" }
docs = { features = ["docs"], no-default-feature = true }

