repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.2
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/astral-sh/ty-pre-commit
  # ty version
  rev: v0.0.70
  hooks:
    - id: ty
      # the following is required so we don't create a .venv folder/uv.lock file
      args: [ --isolated ]